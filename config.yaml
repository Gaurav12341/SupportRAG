# All tunable settings live here. Values marked "placeholder" are starting
# points, not tuned results.

llm:
  # Default: LM Studio local server (OpenAI-compatible).
  local:
    base_url: http://localhost:1234/v1
    model: qwen2.5-3b-instruct
    timeout_s: 60
  # Failsafe: used only if local is unreachable, times out or returns unusable output.
  # Key comes from GROQ_API_KEY in .env, never from this file.
  groq:
    base_url: https://api.groq.com/openai/v1
    model: openai/gpt-oss-120b
    timeout_s: 30
    max_tokens: 1500        # gpt-oss thinks first; the thinking tokens count against this
    reasoning_effort: low
  prefer: local    # which provider goes first by default (the other is the failsafe); a call can override it
  temperature: 0.1
  max_tokens: 700
  fallback_log: logs/fallbacks.log

models:          # all run on CPU so the GPU is left to the LLM (see docs/DECISIONS.md)
  embedding: BAAI/bge-small-en-v1.5
  reranker: cross-encoder/ms-marco-MiniLM-L-6-v2
  nli: cross-encoder/nli-deberta-v3-small
  device: cpu

qdrant:
  url: http://localhost:6333
  collection: support_docs

chunking:        # bge-small reads at most 512 tokens
  strategy: fixed      # fixed | headings; headings did not help on its own (docs/DECISIONS.md)
  size_tokens: 500
  overlap_tokens: 50   # used by fixed, and for oversized plain-text blocks
  min_tokens: 100      # headings: a chunk smaller than this absorbs the next section

ingest:
  min_chars: 300   # pages shorter than this after cleaning (index/stub pages) are skipped

retrieval:       # placeholder
  mode: hybrid     # dense | hybrid (+ BM25, RRF) | rerank (+ cross-encoder); hybrid kept, rerank off (docs/DECISIONS.md)
  k_dense: 20
  k_bm25: 20
  rrf_k: 60
  k_rerank_in: 30  # candidates sent to the cross-encoder
  k_context: 5     # chunks kept after reranking

query:          # stage 7: question -> search plan (src/query.py, search_plan in src/search.py)
  llm: local               # which LLM writes the plan first; the other is the failsafe
  max_queries: 3
  cache: data/cache/query_plans.json
  use: []                  # parts of the plan the pipeline uses: rewrite | route | hyde. [] = plain search (nothing proven to help yet)

# SIMULATED access: the docs are public, so levels are assigned by configs/access_rules.yaml. Roles and the
# license rule are in src/access.py: public = base_levels for every product; member = base_levels for every product
# plus licensed_levels for the products they hold a license for; admin = admin_levels.
access:
  base_levels: [public]
  licensed_levels: [internal, restricted]
  admin_levels: [public, internal, restricted]

thresholds:      # placeholder
  min_rerank_score: 0.0
  min_nli_entailment: 0.3       # a step is supported if NLI entailment against its cited text is at least this; 0.3 picked on the tune split (docs/DECISIONS.md)
  min_copied_trigrams: 0.7      # or supported if this share of the step's word triples is copied from the cited text
  min_supported_fraction: 0.5   # refuse if fewer than this share of the steps are supported; 0.4 was tried and did not help (docs/DECISIONS.md)

context:         # stage 12; sizes in characters (about 4 per token), so LM Studio's context is not overrun
  max_section_chars: 2800       # a parent section longer than this falls back to the retrieved chunk itself
  max_context_chars: 8000       # total text sent to the model

answer:
  refuse_text: "No documented fix found."

safety:          # stage 14, output side. Warn when a step contains one of these commands (regex, case-insensitive)
  dangerous_commands:
    - {pattern: '\bkubectl\s+delete\b', warning: "kubectl delete removes cluster objects. Check the namespace and name first (--dry-run=client shows what would go)."}
    - {pattern: '\bdrop\s+(table|database|schema)\b', warning: "DROP permanently deletes data. Back up first and check you are connected to the right database."}
    - {pattern: '\btruncate\s+(table\s+)?\w', warning: "TRUNCATE deletes every row at once. Back up first."}
    - {pattern: 'kafka-topics[^\n]*--delete\b|--delete\b[^\n]*kafka-topics', warning: "Deleting a Kafka topic destroys its messages. Check the topic name and that no consumer still needs it."}

paths:
  raw_docs: data/raw
  processed: data/processed
  eval_dir: eval
  eval_results: eval/results
  access_db: data/access.db   # users, roles, product licenses, audit log (SQLite)
