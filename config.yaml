# All tunable settings live here. Values marked "placeholder" are starting
# points, not tuned results.

llm:
  # Default: LM Studio local server (OpenAI-compatible).
  local:
    base_url: http://localhost:1234/v1
    model: qwen2.5-3b-instruct
    timeout_s: 60
  # Failsafe: used only if local is unreachable, times out or returns unusable output.
  # Key comes from GROQ_API_KEY in .env, never from this file.
  groq:
    base_url: https://api.groq.com/openai/v1
    model: openai/gpt-oss-120b
    timeout_s: 30
    max_tokens: 1500        # gpt-oss thinks first; the thinking tokens count against this
    reasoning_effort: low
    # Free tier, per model (gpt-oss-120b, gpt-oss-20b and qwen/qwen3.8-27b each have their own bucket); checked against the
    # x-ratelimit-* headers on 2026-10-20. src/llm.py waits for the minute limits and stops cleanly at the daily ones.
    limits: {requests_per_min: 30, requests_per_day: 1000, tokens_per_min: 8000, tokens_per_day: 200000}
    usage_log: data/cache/groq_usage.jsonl   # every Groq call's tokens; the rolling 24-hour total is read from here
  cache_dir: data/cache     # llm_<name>.jsonl: finished replies of calls made with cache="<name>"
  prefer: local    # which provider goes first by default (the other is the failsafe); a call can override it
  temperature: 0.1
  max_tokens: 700
  fallback_log: logs/fallbacks.log

models:          # all run on CPU so the GPU is left to the LLM (see docs/DECISIONS.md)
  embedding: BAAI/bge-small-en-v1.5
  reranker: cross-encoder/ms-marco-MiniLM-L-6-v2
  nli: cross-encoder/nli-deberta-v3-small
  device: cpu

qdrant:
  url: http://localhost:6333
  collection: support_docs

chunking:        # bge-small reads at most 512 tokens
  strategy: fixed      # fixed | headings; headings did not help on its own (docs/DECISIONS.md)
  size_tokens: 500
  overlap_tokens: 50   # used by fixed, and for oversized plain-text blocks
  min_tokens: 100      # headings: a chunk smaller than this absorbs the next section

ingest:
  min_chars: 300   # pages shorter than this after cleaning (index/stub pages) are skipped

retrieval:       # placeholder
  mode: hybrid     # dense | hybrid (+ BM25, RRF) | rerank (+ cross-encoder); hybrid kept, rerank off (docs/DECISIONS.md)
  k_dense: 20
  k_bm25: 20
  rrf_k: 60
  k_rerank_in: 30  # candidates sent to the cross-encoder
  k_context: 5     # chunks kept after reranking

query:          # stage 7: question -> search plan (src/query.py, search_plan in src/search.py)
  llm: local               # which LLM writes the plan first; the other is the failsafe
  max_queries: 3
  cache: data/cache/query_plans.json
  use: []                  # parts of the plan the pipeline uses: rewrite | route | hyde. [] = plain search (nothing proven to help yet)

# SIMULATED access: the docs are public, so levels are assigned by configs/access_rules.yaml. Roles and the
# license rule are in src/access.py: public = base_levels for every product; member = base_levels for every product
# plus licensed_levels for the products they hold a license for; admin = admin_levels.
access:
  base_levels: [public]
  licensed_levels: [internal, restricted]
  admin_levels: [public, internal, restricted]

retry:           # stage 16: one more, wider try when the writer reports partial or no coverage (Phase 4b in docs/IMPROVEMENT_PLAN.md)
  enabled: false                   # measured, no gain on the dev subset (80.0% vs 82.5%, docs/DECISIONS.md Phase 4)
  when: [partial, none]            # the writer's `coverage` values that trigger it
  plan_llm: groq                   # who writes the query plan (src/query.py) ...
  plan_model: openai/gpt-oss-20b   # ... on this Groq model = its own token bucket (answers use 120b)
  use: [rewrite, route, hyde]      # parts of the plan used (search_plan); the writer's `missing` text is always added as a query
  k_context: 12                    # chunks kept after merging with the first hits (first pass: 10)
  max_context_chars: 14000         # context budget of the second answer (first pass: 12000)

verify:          # stage 14: how a drafted answer is checked against the excerpts it cites (src/verify.py, Phase 3 in docs/IMPROVEMENT_PLAN.md)
  method: llm                   # llm = one claim check per answer; nli = the local scorer below (also the automatic fallback when the llm call fails)
  llm: {model: "openai/gpt-oss-20b", max_tokens: 1200, reasoning_effort: low}   # its own Groq bucket (answers use 120b, the eval judge qwen)
  partial_note: "The docs only cover part of this."   # shown when the check says the answer covers only part of the question

# The NLI settings below are used only by verify.method: nli (the fallback), and by eval/answer.py
thresholds:      # placeholder
  min_rerank_score: 0.0
  min_nli_entailment: 0.3       # a step is supported if NLI entailment against its cited text is at least this; 0.3 picked on the tune split (docs/DECISIONS.md)
  min_copied_trigrams: 0.7      # or supported if this share of the step's word triples is copied from the cited text
  min_supported_fraction: 0.5   # refuse if fewer than this share of the steps are supported; 0.4 was tried and did not help (docs/DECISIONS.md)

context:         # stage 12; sizes in characters (about 4 per token), so LM Studio's context is not overrun
  max_section_chars: 2800       # a parent section longer than this falls back to the retrieved chunk itself
  max_context_chars: 8000       # total text sent to the model

answer:
  llm: groq                 # which LLM writes the answer first; the other is the failsafe and every fallback is logged (D1 in docs/IMPROVEMENT_PLAN.md)
  reasoning_effort: low     # Groq gpt-oss only; its thinking tokens count against max_tokens and the token budget
  max_tokens: 1800
  refuse_text: "No documented fix found."
  context:                  # how much the writer reads (stage 12), applied by src.answer.answer_cfg
    local: {k_context: 5, max_context_chars: 8000, max_section_chars: 2800}    # fits LM Studio's 4k-token window
    groq: {k_context: 10, max_context_chars: 12000, max_section_chars: 2000}   # eval.run ctx_recall 0.716 -> 0.810 (docs/DECISIONS.md, Phase 2)

safety:          # stage 14, output side. Warn when a step contains one of these commands (regex, case-insensitive)
  dangerous_commands:
    - {pattern: '\bkubectl\s+delete\b', warning: "kubectl delete removes cluster objects. Check the namespace and name first (--dry-run=client shows what would go)."}
    - {pattern: '\bdrop\s+(table|database|schema)\b', warning: "DROP permanently deletes data. Back up first and check you are connected to the right database."}
    - {pattern: '\btruncate\s+(table\s+)?\w', warning: "TRUNCATE deletes every row at once. Back up first."}
    - {pattern: 'kafka-topics[^\n]*--delete\b|--delete\b[^\n]*kafka-topics', warning: "Deleting a Kafka topic destroys its messages. Check the topic name and that no consumer still needs it."}

eval:            # LLM jobs of the answer eval (docs/IMPROVEMENT_PLAN.md Phase 1); each runs on its own Groq model = its own free-tier bucket
  judge: {model: "qwen/qwen3.8-27b", max_tokens: 500}   # grades answers against reference key points; another family than the answer writer
  draft: {model: "openai/gpt-oss-20b", max_tokens: 1500}   # drafts new test questions (then checked by hand)
  keypoints: {model: "qwen/qwen3.8-27b", max_tokens: 900}  # drafts key points for existing questions (then checked by hand)

paths:
  raw_docs: data/raw
  processed: data/processed
  eval_dir: eval
  eval_results: eval/results

mongo:           # users, roles, password hashes, product licenses, audit log (docker-compose service `mongo`); the password is MONGO_PASSWORD in .env
  host: 127.0.0.1
  port: 27017
  user: supportrag
  db: supportrag
  timeout_ms: 3000

input:           # stage 7: input safety (src/guard.py). Rules, not a model; eval/safety_prompts.json + `python -m eval.safety` report what they catch and miss
  max_chars: 1000          # longest question accepted
  scan_chunks: true        # leave retrieved chunks that look like injected instructions out of the context
  max_history_turns: 3     # earlier question/answer pairs kept for follow-ups
  max_history_chars: 2000  # each earlier turn is cut to this many characters

rewrite:         # stage 7: follow-up -> standalone question, and which product the question is about (src/rewrite.py)
  llm: groq
  model: openai/gpt-oss-20b   # own Groq bucket (answers use 120b)
  max_tokens: 600
  detect_product: true        # run the query plan (src/query.py) to name the product(s); the name is shown to the user
  route_product: false        # also restrict the search to that product. OFF: not measured on accuracy; a wrong single guess would hide the right docs (docs/DECISIONS.md)

auth:            # stage 7: login (src/auth.py, src/api.py). JWT_SECRET lives in .env (scripts/setup_users.py creates it), never here
  token_minutes: 60
  demo_users:             # created by `python -m scripts.setup_users`; passwords are generated and printed once
    - {user: alice, role: member, licenses: [kubernetes, postgres]}
    - {user: bob, role: member, licenses: []}
    - {user: admin, role: admin, licenses: []}
